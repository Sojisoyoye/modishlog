name: CVE Dependency Scan

# Reusable workflow — call with `uses: ./.github/workflows/_dependency-scan.yml`
# Pinned to pip-audit 2.10.1; bump here to update all callers at once.
# S8: --fail-on-vuln causes the job to exit non-zero if any CVE is found,
# blocking merges to main when unfixed vulnerabilities exist.
on:
  workflow_call:

jobs:
  scan:
    name: CVE dependency scan (pip-audit 2.10.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install pip-audit==2.10.1
      # S8: pip-audit exits non-zero by default when CVEs are found (--fail-on-vuln
      # was removed; it is not a valid flag in pip-audit 2.x and caused CI failures).
      - run: pip-audit -r requirements.txt --progress-spinner off
        working-directory: backend
