name: Admin Password Reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm'
        required: false
        default: 'yes'

jobs:
  reset:
    name: Reset admin user password
    runs-on: ubuntu-latest
    steps:
      - name: Reset password via backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ADMIN_PASSWORD
          script: >-
            docker exec modishlog-backend python3 -c "
            import asyncio, os;
            from passlib.context import CryptContext;
            from sqlalchemy.ext.asyncio import create_async_engine;
            from sqlalchemy import text;
            pwd = CryptContext(schemes=['bcrypt'], deprecated='auto').hash(os.environ['ADMIN_PASSWORD']);
            email = 'admin@modishlog.com';
            async def run():
              e = create_async_engine(os.environ['DATABASE_URL']);
              async with e.begin() as c:
                r = await c.execute(text('UPDATE users SET hashed_password=:h,failed_login_attempts=0,locked_until=NULL WHERE email=:e'), {'h':pwd,'e':email});
                print('updated', r.rowcount);
                if r.rowcount == 0:
                  await c.execute(text('INSERT INTO users(id,email,hashed_password,full_name,is_active) VALUES(gen_random_uuid(),:e,:h,chr(65)||chr(100)||chr(109)||chr(105)||chr(110),true)'), {'e':email,'h':pwd});
                  print('inserted');
              await e.dispose();
            asyncio.run(run());
            print('done')
            "
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
