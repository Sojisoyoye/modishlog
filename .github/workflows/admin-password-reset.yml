name: Admin Password Reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm'
        required: false
        default: 'yes'

jobs:
  reset:
    name: Reset admin user password
    runs-on: ubuntu-latest
    steps:
      - name: Reset password via backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ADMIN_PASSWORD
          script: |
            BACKEND=$(docker ps --format '{{.Names}}' | grep -E 'backend' | head -1)
            DB=$(docker ps --format '{{.Names}}' | grep -E '\-db' | head -1)
            echo "Backend container: $BACKEND"
            echo "DB container: $DB"
            HASH=$(docker exec -e ADMIN_PASSWORD="$ADMIN_PASSWORD" "$BACKEND" python3 -c "from passlib.context import CryptContext; import os; print(CryptContext(schemes=['bcrypt'],deprecated='auto').hash(os.environ['ADMIN_PASSWORD']))" 2>/dev/null | tail -1)
            echo "Hash prefix: ${HASH:0:7}"
            PGUSER=$(docker exec "$DB" sh -c 'echo $POSTGRES_USER')
            PGDB=$(docker exec "$DB" sh -c 'echo $POSTGRES_DB')
            echo "DB user: $PGUSER, DB name: $PGDB"
            printf "UPDATE users SET hashed_password='%s', failed_login_attempts=0, locked_until=NULL WHERE email='admin@modishlog.com';\n" "$HASH" | docker exec -i "$DB" psql -U "$PGUSER" -d "$PGDB"
            COUNT=$(docker exec "$DB" psql -U "$PGUSER" -d "$PGDB" -tAc "SELECT COUNT(*) FROM users WHERE email='admin@modishlog.com';")
            echo "User rows found: $COUNT"
            if [ "$COUNT" = "0" ]; then
              ID=$(python3 -c "import uuid; print(uuid.uuid4())")
              printf "INSERT INTO users(id,email,hashed_password,full_name,is_active) VALUES('%s','admin@modishlog.com','%s','Admin User',true);\n" "$ID" "$HASH" | docker exec -i "$DB" psql -U "$PGUSER" -d "$PGDB"
              echo "User inserted"
            else
              echo "User updated successfully"
            fi
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
