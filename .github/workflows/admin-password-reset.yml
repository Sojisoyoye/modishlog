name: Admin Password Reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm'
        required: false
        default: 'yes'

jobs:
  reset:
    name: Reset admin user password
    runs-on: ubuntu-latest
    steps:
      - name: Reset password via backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ADMIN_PASSWORD
          script: |
            echo "All running backend containers:"
            docker ps --format '{{.Names}}\t{{.Image}}' | grep -E 'backend'
            for BACKEND in $(docker ps --format '{{.Names}}' | grep -E 'backend'); do
            echo "=== Processing container: $BACKEND ==="
            echo "" | base64 -d > /tmp/reset_admin.py
            docker cp /tmp/reset_admin.py "$BACKEND":/tmp/reset_admin.py
            docker exec -e ADMIN_PASSWORD="$ADMIN_PASSWORD" "$BACKEND" python3 /tmp/reset_admin.py
            docker exec "$BACKEND" rm /tmp/reset_admin.py
            rm /tmp/reset_admin.py
            echo "--- Internal login test ---"
            echo "" | base64 -d > /tmp/test_login.py
            docker cp /tmp/test_login.py "$BACKEND":/tmp/test_login.py
            docker exec "$BACKEND" python3 /tmp/test_login.py
            docker exec "$BACKEND" rm /tmp/test_login.py
            rm /tmp/test_login.py
            done
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
