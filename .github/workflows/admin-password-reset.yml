name: Admin Password Reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm'
        required: false
        default: 'yes'

jobs:
  reset:
    name: Reset admin user password
    runs-on: ubuntu-latest
    steps:
      - name: Reset password via backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ADMIN_PASSWORD
          script: |
            echo "" | base64 -d > /tmp/reset_admin.py
            docker cp /tmp/reset_admin.py modishlog-backend:/tmp/reset_admin.py
            docker exec -e ADMIN_PASSWORD="$ADMIN_PASSWORD" modishlog-backend python3 /tmp/reset_admin.py
            rm /tmp/reset_admin.py
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
