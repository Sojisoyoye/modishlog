name: Admin Password Reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to confirm'
        required: false
        default: 'yes'

jobs:
  reset:
    name: Reset admin user password
    runs-on: ubuntu-latest
    steps:
      - name: Reset password via backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ADMIN_PASSWORD
          script: |
            HASH=$(docker exec -e ADMIN_PASSWORD="$ADMIN_PASSWORD" modishlog-backend python3 -c "from passlib.context import CryptContext; import os; print(CryptContext(schemes=['bcrypt'],deprecated='auto').hash(os.environ['ADMIN_PASSWORD']))" 2>/dev/null | tail -1)
            echo "Hash prefix: ${HASH:0:7}"
            printf "UPDATE users SET hashed_password='%s', failed_login_attempts=0, locked_until=NULL WHERE email='admin@modishlog.com';\n" "$HASH" | docker exec -i modishlog-db psql -U modishlog -d modishlog
            COUNT=$(docker exec modishlog-db psql -U modishlog -d modishlog -tAc "SELECT COUNT(*) FROM users WHERE email='admin@modishlog.com';")
            if [ "$COUNT" = "0" ]; then
              ID=$(cat /proc/sys/kernel/random/uuid 2>/dev/null || python3 -c "import uuid; print(uuid.uuid4())")
              printf "INSERT INTO users(id,email,hashed_password,full_name,is_active,role) VALUES('%s','admin@modishlog.com','%s','Admin User',true,'admin');\n" "$ID" "$HASH" | docker exec -i modishlog-db psql -U modishlog -d modishlog
              echo "User inserted"
            else
              echo "User updated (rows in DB: $COUNT)"
            fi
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
