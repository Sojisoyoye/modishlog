name: Configure Caddy on Hetzner

on:
  workflow_dispatch:
    inputs:
      add_domain:
        description: "Domain to add/update in the Caddyfile (reverse-proxied to the staging backend, with CORS preflight handling). Leave blank to skip."
        required: false
        default: "api.staging.modishlog.com"
      cors_origin:
        description: "Frontend origin allowed via CORS for add_domain's block."
        required: false
        default: "https://staging.modishlog.com"
      remove_domain:
        description: "Domain block to strip from the Caddyfile without re-adding. Leave blank to skip."
        required: false
        default: ""

env:
  HETZNER_HOST: ${{ secrets.HETZNER_HOST }}

jobs:
  configure-caddy:
    name: Update Caddyfile domains
    runs-on: ubuntu-latest
    steps:
      - name: Update Caddyfile and reload Caddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ADD_DOMAIN,REMOVE_DOMAIN,CORS_ORIGIN
          script: |
            set -e

            CADDYFILE=/opt/modish/Caddyfile

            # Get IPv4-only Docker bridge gateway (inspect returns IPv4+IPv6 concatenated).
            DOCKER_GW=$(docker network inspect bridge \
              --format '{{range .IPAM.Config}}{{.Gateway}}{{"\n"}}{{end}}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            BACKEND="${DOCKER_GW}:8002"

            echo "=== Docker gateway: $DOCKER_GW ==="
            echo "=== Backend target: $BACKEND ==="

            echo "=== Current Caddyfile ==="
            cat "$CADDYFILE"

            # Strip existing blocks for both domains, matching braces (blocks
            # can nest, e.g. the CORS-preflight handlers below), then re-add
            # the add_domain block with the correct backend address (IPv4
            # gateway instead of container name) and CORS preflight handling
            # mirroring the existing api-modishlog.modishstandard.com block.
            # remove_domain is left stripped and not re-added.
            python3 - <<PYEOF
            import os, pathlib

            add_domain = os.environ.get("ADD_DOMAIN", "").strip()
            remove_domain = os.environ.get("REMOVE_DOMAIN", "").strip()
            cors_origin = os.environ.get("CORS_ORIGIN", "").strip()
            backend = "$BACKEND"

            def strip_block(text, domain):
                needle = domain + " {"
                start = text.find(needle)
                if start == -1:
                    return text
                depth = 0
                i = text.index("{", start)
                block_start = i
                while i < len(text):
                    if text[i] == "{":
                        depth += 1
                    elif text[i] == "}":
                        depth -= 1
                        if depth == 0:
                            end = i + 1
                            new_text = text[:start].rstrip("\n") + text[end:]
                            return new_text.lstrip("\n") if start == 0 else new_text
                    i += 1
                raise ValueError(f"unbalanced braces in existing block for {domain}")

            path = pathlib.Path("$CADDYFILE")
            text = path.read_text()

            for domain in filter(None, [add_domain, remove_domain]):
                text = strip_block(text, domain)

            if add_domain:
                block = f'''{add_domain} {{
                @cors_preflight {{
                    method OPTIONS
                }}
                handle @cors_preflight {{
                    header Access-Control-Allow-Origin "{cors_origin}"
                    header Access-Control-Allow-Credentials "true"
                    header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                    header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With"
                    header Access-Control-Max-Age "3600"
                    respond 204
                }}
                handle {{
                    reverse_proxy {backend} {{
                        header_down -Access-Control-Allow-Origin
                        header_down -Access-Control-Allow-Credentials
                        header_down -Access-Control-Allow-Methods
                        header_down -Access-Control-Allow-Headers
                    }}
                    header Access-Control-Allow-Origin "{cors_origin}"
                    header Access-Control-Allow-Credentials "true"
                }}
            }}
            '''
                text = text.rstrip() + "\n\n" + block

            path.write_text(text)
            print("Caddyfile updated")
            PYEOF

            echo "=== Updated Caddyfile ==="
            cat "$CADDYFILE"

            # Validate then reload inside the Caddy container
            docker exec caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "Caddy reloaded"

            # Quick smoke-test
            if [ -n "$ADD_DOMAIN" ]; then
              echo "=== Health check via gateway ==="
              docker exec caddy wget -qO- --timeout=5 "http://$BACKEND/health" 2>&1 || true
            fi
        env:
          ADD_DOMAIN: ${{ inputs.add_domain }}
          REMOVE_DOMAIN: ${{ inputs.remove_domain }}
          CORS_ORIGIN: ${{ inputs.cors_origin }}
