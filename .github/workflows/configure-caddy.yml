name: Configure Caddy on Hetzner

on:
  workflow_dispatch:

env:
  HETZNER_HOST: 178.104.122.53

jobs:
  configure-caddy:
    name: Add api-modishlog.modishstandard.com to Caddyfile
    runs-on: ubuntu-latest
    steps:
      - name: Update Caddyfile and reload Caddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e

            CADDYFILE=/opt/modish/Caddyfile
            DOMAIN=api-modishlog.modishstandard.com

            # Caddy runs in Docker; reach backend via Docker bridge gateway
            DOCKER_GW=$(docker network inspect bridge --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}')
            BACKEND="${DOCKER_GW}:8002"

            echo "=== Current Caddyfile ==="
            cat "$CADDYFILE"

            if grep -q "$DOMAIN" "$CADDYFILE"; then
              echo "✅ $DOMAIN already present — skipping"
            else
              cat >> "$CADDYFILE" <<EOF

            $DOMAIN {
                reverse_proxy $BACKEND
            }
            EOF
              echo "✅ Added $DOMAIN -> $BACKEND"
            fi

            echo "=== Updated Caddyfile ==="
            cat "$CADDYFILE"

            # Validate and reload inside the Caddy container
            docker exec caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "✅ Caddy reloaded"
