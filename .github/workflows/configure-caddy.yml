name: Configure Caddy on Hetzner

on:
  workflow_dispatch:
    inputs:
      add_domain:
        description: "Domain to add/update in the Caddyfile (reverse-proxied to the staging backend). Leave blank to skip."
        required: false
        default: "api.staging.modishlog.com"
      remove_domain:
        description: "Domain block to strip from the Caddyfile without re-adding. Leave blank to skip."
        required: false
        default: ""

env:
  HETZNER_HOST: ${{ secrets.HETZNER_HOST }}

jobs:
  configure-caddy:
    name: Update Caddyfile domains
    runs-on: ubuntu-latest
    steps:
      - name: Update Caddyfile and reload Caddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ADD_DOMAIN,REMOVE_DOMAIN
          script: |
            set -e

            CADDYFILE=/opt/modish/Caddyfile

            # Get IPv4-only Docker bridge gateway (inspect returns IPv4+IPv6 concatenated).
            DOCKER_GW=$(docker network inspect bridge \
              --format '{{range .IPAM.Config}}{{.Gateway}}{{"\n"}}{{end}}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            BACKEND="${DOCKER_GW}:8002"

            echo "=== Docker gateway: $DOCKER_GW ==="
            echo "=== Backend target: $BACKEND ==="

            echo "=== Current Caddyfile ==="
            cat "$CADDYFILE"

            # Strip existing blocks for both domains (handles multiline), then
            # re-add the add_domain block with the correct backend address
            # (IPv4 gateway instead of container name). remove_domain is left
            # stripped and not re-added.
            python3 - <<PYEOF
            import os, re, pathlib

            add_domain = os.environ.get("ADD_DOMAIN", "").strip()
            remove_domain = os.environ.get("REMOVE_DOMAIN", "").strip()
            backend = "$BACKEND"

            path = pathlib.Path("$CADDYFILE")
            text = path.read_text()

            for domain in filter(None, [add_domain, remove_domain]):
                text = re.sub(
                    rf'\n?{re.escape(domain)}\s*\{{[^}}]*\}}',
                    '',
                    text,
                    flags=re.DOTALL,
                )

            if add_domain:
                text = text.rstrip() + f"\n\n{add_domain} {{\n    reverse_proxy {backend}\n}}\n"

            path.write_text(text)
            print("Caddyfile updated")
            PYEOF

            echo "=== Updated Caddyfile ==="
            cat "$CADDYFILE"

            # Validate then reload inside the Caddy container
            docker exec caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "Caddy reloaded"

            # Quick smoke-test
            if [ -n "$ADD_DOMAIN" ]; then
              echo "=== Health check via gateway ==="
              docker exec caddy wget -qO- --timeout=5 "http://$BACKEND/health" 2>&1 || true
            fi
        env:
          ADD_DOMAIN: ${{ inputs.add_domain }}
          REMOVE_DOMAIN: ${{ inputs.remove_domain }}
