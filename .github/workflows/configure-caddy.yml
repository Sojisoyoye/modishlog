name: Configure Caddy on Hetzner

on:
  workflow_dispatch:

env:
  HETZNER_HOST: 178.104.122.53

jobs:
  configure-caddy:
    name: Add api-modishlog.modishstandard.com to Caddyfile
    runs-on: ubuntu-latest
    steps:
      - name: Update Caddyfile and reload Caddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "=== Locating Caddy ==="
            which caddy || true
            caddy version || true

            echo "=== Caddy process ==="
            ps aux | grep caddy | grep -v grep || true

            echo "=== Caddy service ==="
            systemctl status caddy --no-pager 2>/dev/null || true

            echo "=== Searching for Caddyfile ==="
            find / -name "Caddyfile" 2>/dev/null | grep -v proc || true
            find / -name "caddy.json" 2>/dev/null | grep -v proc || true

            echo "=== Docker containers ==="
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}" || true

            echo "=== Listening ports ==="
            ss -tlnp | grep -E "80|443|8002|8000" || netstat -tlnp | grep -E "80|443|8002|8000" || true
