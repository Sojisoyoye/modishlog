name: Configure Caddy on Hetzner

on:
  workflow_dispatch:

env:
  HETZNER_HOST: 178.104.122.53

jobs:
  configure-caddy:
    name: Add api-modishlog.modishstandard.com to Caddyfile
    runs-on: ubuntu-latest
    steps:
      - name: Update Caddyfile and reload Caddy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e

            CADDYFILE=/opt/modish/Caddyfile
            DOMAIN=api-modishlog.modishstandard.com

            # Get IPv4-only Docker bridge gateway (inspect returns IPv4+IPv6 concatenated).
            DOCKER_GW=$(docker network inspect bridge \
              --format '{{range .IPAM.Config}}{{.Gateway}}{{"\n"}}{{end}}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            BACKEND="${DOCKER_GW}:8002"

            echo "=== Docker gateway: $DOCKER_GW ==="
            echo "=== Backend target: $BACKEND ==="

            echo "=== Installed Caddy modules (cors/security) ==="
            docker exec caddy caddy list-modules 2>&1 | grep -i -E "cors|security|auth" || echo "(none)"

            echo "=== Current Caddyfile ==="
            cat "$CADDYFILE"

            # Replace the api-modishlog block using brace-count matching, then
            # re-add it with explicit CORS handling at the Caddy layer.
            python3 - "$BACKEND" <<'PYEOF'
import pathlib, sys

CADDYFILE = "/opt/modish/Caddyfile"
DOMAIN    = "api-modishlog.modishstandard.com"
BACKEND   = sys.argv[1]

path = pathlib.Path(CADDYFILE)
text = path.read_text()

# --- Remove the existing block for DOMAIN (handles nested braces) ---
start = text.find(f'\n{DOMAIN}')
if start == -1:
    start = text.find(f'{DOMAIN}')

if start != -1:
    depth, found_open, end = 0, False, start
    for i, ch in enumerate(text[start:]):
        if ch == '{':
            depth += 1
            found_open = True
        elif ch == '}':
            depth -= 1
            if found_open and depth == 0:
                end = start + i + 1
                break
    text = text[:start] + text[end:]
    print("Removed existing block")

# --- Append new block with CORS preflight handling ---
new_block = (
    f"\n\n{DOMAIN} {{\n"
    f"    # CORS preflight: respond before any upstream security module sees it.\n"
    f"    @cors_preflight {{\n"
    f"        method OPTIONS\n"
    f"    }}\n"
    f"    handle @cors_preflight {{\n"
    f"        header Access-Control-Allow-Origin \"https://modishlog-staging.vercel.app\"\n"
    f"        header Access-Control-Allow-Credentials \"true\"\n"
    f"        header Access-Control-Allow-Methods \"GET, POST, PUT, PATCH, DELETE, OPTIONS\"\n"
    f"        header Access-Control-Allow-Headers \"Content-Type, Authorization, X-Requested-With\"\n"
    f"        header Access-Control-Max-Age \"3600\"\n"
    f"        respond 204\n"
    f"    }}\n\n"
    f"    # All other requests: add CORS headers then proxy to backend.\n"
    f"    handle {{\n"
    f"        header Access-Control-Allow-Origin \"https://modishlog-staging.vercel.app\"\n"
    f"        header Access-Control-Allow-Credentials \"true\"\n"
    f"        reverse_proxy {BACKEND}\n"
    f"    }}\n"
    f"}}\n"
)
text = text.rstrip() + new_block
path.write_text(text)
print("Caddyfile updated with CORS handling")
PYEOF

            echo "=== Updated Caddyfile ==="
            cat "$CADDYFILE"

            # Validate then reload inside the Caddy container
            docker exec caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "Caddy reloaded — $DOMAIN -> $BACKEND"

            echo "=== CORS preflight test (expect 204) ==="
            curl -s -w "\nHTTP %{http_code}\n" \
              -X OPTIONS "https://$DOMAIN/api/v1/auth/login" \
              -H "Origin: https://modishlog-staging.vercel.app" \
              -H "Access-Control-Request-Method: POST" \
              -H "Access-Control-Request-Headers: content-type" \
              -D - || true

            echo "=== Login POST with Origin test (expect 200) ==="
            curl -s -w "\nHTTP %{http_code}\n" \
              -X POST "https://$DOMAIN/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -H "Origin: https://modishlog-staging.vercel.app" \
              -d '{"email":"admin@modishlog.com","password":"ModishAdmin@2024!"}' \
              -D - || true
