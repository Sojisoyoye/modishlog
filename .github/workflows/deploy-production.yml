name: Deploy Production (modishlog.com)

# Production deployments are NEVER automatic.
# Trigger only via manual workflow_dispatch or a release tag.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Backend image tag to deploy (e.g. staging-abc1234 or a SHA)'
        required: true
        type: string
      confirm:
        description: 'Type "deploy-production" to confirm you want to push to live'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/sojisoyoye/modishlog/backend
  DEPLOY_DIR: /root/modishlog-prod

jobs:
  # ─── Safety gate ──────────────────────────────────────────────────────────
  confirm-intent:
    name: Confirm production intent
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate confirmation string
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-production" ]; then
            echo "❌ Confirmation string did not match 'deploy-production'. Aborting."
            exit 1
          fi
          echo "✅ Confirmation accepted."

  # ─── Run backend tests before any production deploy ───────────────────────
  test-backend:
    name: Backend tests (production gate)
    runs-on: ubuntu-latest
    needs: [confirm-intent]
    if: always() && (needs.confirm-intent.result == 'success' || github.event_name == 'push')
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modishlog
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: modishlog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modishlog"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: pytest tests/ --tb=short -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://modishlog:test_password@localhost/modishlog_test
          SECRET_KEY: test-secret-key-for-ci-placeholder-32chars
          ENVIRONMENT: test
          UPLOAD_DIR: /tmp/uploads

  # ─── CVE dependency scan ──────────────────────────────────────────────────
  dependency-scan:
    needs: [test-backend]
    if: needs.test-backend.result == 'success'
    uses: ./.github/workflows/_dependency-scan.yml

  # ─── Build production image ────────────────────────────────────────────────
  build-production:
    name: Build & push production image
    needs: [test-backend, dependency-scan]
    if: needs.dependency-scan.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=production
            type=sha,prefix=prod-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy frontend to Vercel production ────────────────────────────────
  deploy-frontend:
    name: Deploy frontend to Vercel (modishlog.com)
    needs: [build-production]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        working-directory: ./frontend
        run: npx vercel@latest --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.PRODUCTION_VERCEL_PROJECT_ID }}

  # ─── Deploy to Hetzner production VPS ─────────────────────────────────────
  deploy-production:
    name: Deploy to production (modishlog.com)
    needs: [build-production]
    runs-on: ubuntu-latest
    # This environment requires manual approval from a designated reviewer
    # Configure in: GitHub → Settings → Environments → production → Required reviewers
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -e

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u sojisoyoye --password-stdin

            cd ${{ env.DEPLOY_DIR }}

            # Pull the new production image
            docker compose --env-file .env.production pull backend

            # Ensure db is running (idempotent — no-op if already healthy)
            docker compose --env-file .env.production up -d db
            docker compose --env-file .env.production exec -T db sh -c \
              'until pg_isready -U ${POSTGRES_USER:-modishlog}; do sleep 1; done'

            # Run migrations
            docker compose --env-file .env.production run --rm --no-deps backend alembic upgrade head

            # Ensure uploads volume has correct permissions for non-root app user
            docker run --rm \
              -v modishlog-prod_modishlog_uploads:/app/uploads \
              alpine sh -c "mkdir -p /app/uploads/products /app/uploads/logos && chmod -R 777 /app/uploads"

            # Rolling restart — backend only, zero-downtime via health check
            docker compose --env-file .env.production up -d --no-deps backend

            # Smoke test — wait up to 2 minutes for /health to return 200
            for i in $(seq 1 24); do
              STATUS=$(curl -sf -o /dev/null -w "%{http_code}" https://api.modishlog.com/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Production healthy at api.modishlog.com"
                exit 0
              fi
              echo "Waiting for production... attempt $i/24 (HTTP $STATUS)"
              sleep 5
            done
            echo "❌ Production health check failed after 2 minutes"
            exit 1

  # ─── Post-deploy notification ─────────────────────────────────────────────
  notify:
    name: Notify deploy outcome
    needs: [deploy-production]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Report result
        run: |
          if [ "${{ needs.deploy-production.result }}" = "success" ]; then
            echo "✅ Production deploy succeeded — modishlog.com (Vercel) + api.modishlog.com (Hetzner) are live"
          else
            echo "❌ Production deploy FAILED — check logs and rollback if needed"
            exit 1
          fi
