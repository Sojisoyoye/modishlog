name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/sojisoyoye/modishlog/backend
  RESOURCE_GROUP: rg-modishlog-staging
  CONTAINER_APP: modishlog-backend-staging
  MIGRATE_JOB: modishlog-migrate-staging
  SUBSCRIPTION_ID: 8b21f152-e36b-4d53-9b88-70fc38d906bc

jobs:
  # ─── 1. Run tests before deploying ────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modishlog
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: modishlog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modishlog"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: pytest tests/ --tb=short -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://modishlog:test_password@localhost/modishlog_test
          SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
          UPLOAD_DIR: /tmp/uploads

  # ─── 2. Build and push backend image to GHCR ──────────────────────────────
  build-backend:
    name: Build & push backend
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # e.g. "staging-abc1234" — the short-SHA tag used by deploy-backend
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=staging-,format=short
            type=raw,value=staging

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Deploy frontend to Vercel ─────────────────────────────────────────
  # Vercel re-builds from source using vercel.json buildCommand, which runs
  # the sed substitution itself using the STAGING_API_URL env var set in the
  # Vercel project settings (dashboard → Settings → Environment Variables).
  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        working-directory: ./frontend
        run: npx vercel@latest --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── 4. Deploy backend to Azure Container Apps ────────────────────────────
  deploy-backend:
    name: Deploy backend to Azure
    # Needs build-backend so we can reference its image_tag output
    needs: build-backend
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --image ${{ env.BACKEND_IMAGE }}:${{ needs.build-backend.outputs.image_tag }}

      - name: Update migration job image
        run: |
          az containerapp job update \
            --name ${{ env.MIGRATE_JOB }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --image ${{ env.BACKEND_IMAGE }}:${{ needs.build-backend.outputs.image_tag }} \
            --command "alembic" \
            --args "upgrade" "head"

      - name: Run database migrations
        run: |
          az containerapp job start \
            --name ${{ env.MIGRATE_JOB }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --subscription ${{ env.SUBSCRIPTION_ID }}

          # Wait for migration job to complete (max 3 minutes)
          for i in $(seq 1 18); do
            STATUS=$(az containerapp job execution list \
              --name ${{ env.MIGRATE_JOB }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --subscription ${{ env.SUBSCRIPTION_ID }} \
              --query "[0].properties.status" -o tsv)
            echo "Migration status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "✅ Migrations complete"
              exit 0
            elif [ "$STATUS" = "Failed" ]; then
              echo "❌ Migration job failed"
              exit 1
            fi
            sleep 10
          done
          echo "⚠️ Migration job timed out"
          exit 1

      - name: Verify backend health
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --subscription ${{ env.SUBSCRIPTION_ID }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Backend URL: https://$FQDN"
          # Wait up to 60s for the new revision to be healthy
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy"
              exit 0
            fi
            echo "Waiting for backend... ($STATUS)"
            sleep 5
          done
          echo "❌ Backend health check failed"
          exit 1
