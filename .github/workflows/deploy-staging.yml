name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/sojisoyoye/modishlog/backend
  DEPLOY_DIR: /root/modishlog

jobs:
  # ─── 1. Run tests before deploying ────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modishlog
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: modishlog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U modishlog"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: pytest tests/ --tb=short -q
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://modishlog:test_password@localhost/modishlog_test
          SECRET_KEY: test-secret-key-for-ci-placeholder-32chars
          ENVIRONMENT: test
          UPLOAD_DIR: /tmp/uploads

  # ─── 2. Build and push backend image to GHCR ──────────────────────────────
  build-backend:
    name: Build & push backend
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # e.g. "staging-abc1234" — the short-SHA tag used by deploy-backend
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=staging-,format=short
            type=raw,value=staging

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Deploy frontend to Vercel ─────────────────────────────────────────
  # Vercel re-builds from source using vercel.json buildCommand, which runs
  # the sed substitution itself using the STAGING_API_URL env var set in the
  # Vercel project settings (dashboard → Settings → Environment Variables).
  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Vercel
        working-directory: ./frontend
        run: npx vercel@latest --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── 4. Deploy backend to Hetzner via SSH ─────────────────────────────────
  deploy-backend:
    name: Deploy backend to Hetzner
    needs: build-backend
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: GHCR_TOKEN,IMAGE_TAG
          script: |
            set -e

            # Login to GHCR using env var (not inline secret expansion)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u sojisoyoye --password-stdin

            cd ${{ env.DEPLOY_DIR }}

            # Pull the exact SHA-tagged image built by this CI run
            docker-compose pull backend

            # Run migrations before swapping container
            # --no-deps: DB is Neon (external) — no local db service in docker-compose.staging.yml
            docker-compose run --rm --no-deps backend alembic upgrade head

            # Restart backend with new image
            docker-compose up -d --no-deps backend

            # Health-check on port 8000 (backend container host port)
            for i in $(seq 1 24); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "✅ Backend healthy"
                exit 0
              fi
              echo "Waiting for backend... attempt $i/24 ($STATUS)"
              sleep 5
            done
            echo "❌ Backend health check failed after 2 min"
            exit 1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ needs.build-backend.outputs.image_tag }}
