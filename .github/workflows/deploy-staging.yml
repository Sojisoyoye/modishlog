name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/sojisoyoye/modishlog/backend
  RESOURCE_GROUP: rg-modishlog-staging
  CONTAINER_APP: modishlog-backend-staging
  MIGRATE_JOB: modishlog-migrate-staging

jobs:
  # ─── 1. Run tests before deploying ────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: modishlog
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: modishlog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
        working-directory: backend
      - run: pytest backend/tests/ --tb=short -q
        env:
          DATABASE_URL: postgresql+asyncpg://modishlog:test_password@localhost/modishlog_test
          SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test

  # ─── 2. Build and push backend image to GHCR ──────────────────────────────
  build-backend:
    name: Build & push backend
    needs: test-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=staging-,format=short
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 3. Build and push frontend, deploy to Vercel ─────────────────────────
  deploy-frontend:
    name: Deploy frontend to Vercel
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Substitute staging API URL
        run: |
          sed -i "s|__STAGING_API_URL__|${{ secrets.STAGING_API_URL }}|g" \
            src/environments/environment.staging.ts
        working-directory: frontend

      - name: Build Angular (staging)
        run: npm run build:staging
        working-directory: frontend

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: --prod

  # ─── 4. Deploy backend to Azure Container Apps ────────────────────────────
  deploy-backend:
    name: Deploy backend to Azure
    needs: build-backend
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App image
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.BACKEND_IMAGE }}:staging-${{ github.sha }}

      - name: Run database migrations
        run: |
          az containerapp job start \
            --name ${{ env.MIGRATE_JOB }} \
            --resource-group ${{ env.RESOURCE_GROUP }}

          # Wait for migration job to complete (max 3 minutes)
          for i in $(seq 1 18); do
            STATUS=$(az containerapp job execution list \
              --name ${{ env.MIGRATE_JOB }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "[0].properties.status" -o tsv)
            echo "Migration status: $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "✅ Migrations complete"
              exit 0
            elif [ "$STATUS" = "Failed" ]; then
              echo "❌ Migration job failed"
              exit 1
            fi
            sleep 10
          done
          echo "⚠️ Migration job timed out"
          exit 1

      - name: Verify backend health
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "Backend URL: https://$FQDN"
          # Wait up to 60s for the new revision to be healthy
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend healthy"
              exit 0
            fi
            echo "Waiting for backend... ($STATUS)"
            sleep 5
          done
          echo "❌ Backend health check failed"
          exit 1
