name: Diagnose Production

on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Check admin account business_id
    runs-on: ubuntu-latest
    steps:
      - name: Check admin@modishlog.com business_id
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            echo "=== admin@modishlog.com account ==="
            docker exec modishlog-prod-backend python3 -c "
            import asyncio, os, re
            from sqlalchemy.ext.asyncio import create_async_engine
            from sqlalchemy import text

            db_url = os.environ.get('DATABASE_URL', '')
            ssl_required = 'sslmode=require' in db_url
            db_url = re.sub(r'[?&]sslmode=[^&]*', '', db_url).rstrip('?&')
            engine = create_async_engine(db_url, connect_args={'ssl': True} if ssl_required else {})

            async def main():
                async with engine.begin() as conn:
                    rows = await conn.execute(text(\"SELECT email, role, business_id FROM users WHERE email = 'admin@modishlog.com'\"))
                    found = rows.fetchall()
                    if not found:
                        print('No user with email admin@modishlog.com found')
                    for r in found:
                        print(f'  email={r[0]} role={r[1]} business_id={r[2]}')
                await engine.dispose()

            asyncio.run(main())
            "
