name: Diagnose Staging Data
on:
  workflow_dispatch:
env:
  HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Run diagnostic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo  | base64 -d > /tmp/diagnose.py
            docker cp /tmp/diagnose.py modishlog-backend:/tmp/diagnose.py
            docker exec modishlog-backend python3 /tmp/diagnose.py
