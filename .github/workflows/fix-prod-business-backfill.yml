name: Fix Prod — Create owner business and backfill domain tables

# One-shot: prod has existing users + domain data but no business rows because
# the onboarding flow wasn't deployed to prod before v1.0.0.
# Migration d0679eb1beff failed because the backfill SELECT FROM businesses
# returned NULL (empty table).  This workflow:
#   1. Creates a business for each user without a business_id.
#   2. Links those users to their new business.
#   3. Sets business_id on all domain table rows.
# After this succeeds, re-trigger deploy-production.yml.
# Safe to re-run (uses INSERT ... WHERE NOT EXISTS / UPDATE ... WHERE NULL).
on:
  workflow_dispatch:

jobs:
  fix:
    name: Backfill owner business on prod DB
    runs-on: ubuntu-latest
    steps:
      - name: Run business backfill via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cat > /tmp/fix_prod_business.sql << 'EOSQL'
            -- Step 1: Create a business for any owner user that has no business yet.
            -- Uses the user's full_name as the business name.
            INSERT INTO businesses (id, name, currency, timezone, fiscal_year_start_month, is_active, created_at, updated_at)
            SELECT
              gen_random_uuid(),
              COALESCE(u.full_name || '''s Business', 'ModishLog Business'),
              'NGN',
              'Africa/Lagos',
              1,
              true,
              NOW(),
              NOW()
            FROM users u
            WHERE u.business_id IS NULL
            LIMIT 1;

            -- Step 2: Link every user without a business_id to the (now single) business.
            UPDATE users
            SET business_id = (SELECT id FROM businesses ORDER BY created_at LIMIT 1)
            WHERE business_id IS NULL;

            -- Step 3: Backfill all domain tables that may still have NULL business_id.
            --         (These were partially added by the failed d0679eb1beff migration.)
            DO $$
            DECLARE
              tbl text;
              biz_id uuid;
              tbl_list text[] := ARRAY[
                'sales', 'sale_items', 'customers', 'products', 'product_categories',
                'inventory_adjustments', 'purchase_orders', 'purchase_order_items',
                'suppliers', 'fx_rates', 'cashflow_projections', 'cashflow_scenarios',
                'stress_scenarios', 'stock_counts', 'stock_count_items',
                'invoice_schemes', 'locations', 'business_locations', 'expenses',
                'expense_categories', 'recommendations', 'contacts', 'returns',
                'return_items', 'orders', 'order_items', 'reports'
              ];
            BEGIN
              SELECT id INTO biz_id FROM businesses ORDER BY created_at LIMIT 1;
              IF biz_id IS NULL THEN
                RAISE EXCEPTION 'No business found — Step 1 must have failed';
              END IF;

              FOREACH tbl IN ARRAY tbl_list LOOP
                IF EXISTS (
                  SELECT 1 FROM information_schema.columns
                  WHERE table_name = tbl AND column_name = 'business_id'
                ) THEN
                  EXECUTE format(
                    'UPDATE %I SET business_id = $1 WHERE business_id IS NULL',
                    tbl
                  ) USING biz_id;
                  RAISE NOTICE 'Backfilled: %', tbl;
                ELSE
                  RAISE NOTICE 'Skipped (no business_id column yet): %', tbl;
                END IF;
              END LOOP;
            END $$;

            SELECT
              (SELECT count(*) FROM businesses) AS businesses,
              (SELECT count(*) FROM users WHERE business_id IS NOT NULL) AS linked_users;
            EOSQL

            docker compose -f /root/modishlog-prod/docker-compose.yml \
              --env-file /root/modishlog-prod/.env.production \
              exec -T db psql -U modishlog -d modishlog -f /tmp/fix_prod_business.sql

            rm /tmp/fix_prod_business.sql
            echo "Business backfill complete."
