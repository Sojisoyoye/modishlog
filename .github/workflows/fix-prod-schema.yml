name: Fix Prod Schema (backfill missing columns)

# One-shot: adds the 2 columns missing from prod PostgreSQL due to schema gap.
# Run this BEFORE the first production deployment.
# Safe to re-run (uses IF NOT EXISTS).
on:
  workflow_dispatch:

jobs:
  fix:
    name: Backfill missing columns on prod DB
    runs-on: ubuntu-latest
    steps:
      - name: Apply schema backfill
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            echo  | base64 -d > /tmp/fix_prod_schema.py
            docker cp /tmp/fix_prod_schema.py modishlog-prod-backend:/tmp/fix_prod_schema.py
            docker exec modishlog-prod-backend python3 /tmp/fix_prod_schema.py
            rm /tmp/fix_prod_schema.py
