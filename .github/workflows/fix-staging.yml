name: Fix Staging (CORS + Admin Seed)

on:
  workflow_dispatch:

env:
  HETZNER_HOST: 178.104.122.53
  API_URL: https://api-modishlog.modishstandard.com

jobs:
  fix:
    name: Fix CORS and seed admin user
    runs-on: ubuntu-latest
    steps:
      - name: Fix CORS on backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo "=== Current CORS_ORIGINS in running container ==="
            docker inspect modishlog-backend \
              --format '{{range .Config.Env}}{{println .}}{{end}}' \
              | grep -i cors || echo "(not set)"

            echo ""
            echo "=== Server compose files ==="
            find /root/modishlog -name "docker-compose*.yml" 2>/dev/null || echo "(none found)"
            ls /root/modishlog/ 2>/dev/null || echo "(dir not found)"

            echo ""
            echo "=== Server docker-compose.yml ==="
            cat /root/modishlog/docker-compose.yml 2>/dev/null || echo "(not found)"

      - name: Test CORS from server
        run: |
          echo "=== CORS preflight test ==="
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -H "Origin: https://modishlog-staging.vercel.app" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: Content-Type" \
            -X OPTIONS \
            ${{ env.API_URL }}/api/v1/auth/login

          echo "=== CORS response headers ==="
          curl -s -I \
            -H "Origin: https://modishlog-staging.vercel.app" \
            ${{ env.API_URL }}/api/v1/auth/login

      - name: Test login endpoint
        run: |
          echo "=== Test login (expect 401 if user exists, 422/500 if not) ==="
          curl -s -w "\nHTTP %{http_code}\n" \
            -X POST "${{ env.API_URL }}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -H "Origin: https://modishlog-staging.vercel.app" \
            -d '{"email":"admin@modishlog.com","password":"Admin@1234"}'
