name: Fix Staging (CORS + Admin Seed)

on:
  workflow_dispatch:

env:
  HETZNER_HOST: 178.104.122.53
  API_URL: https://api-modishlog.modishstandard.com

jobs:
  fix:
    name: Fix CORS and seed admin user
    runs-on: ubuntu-latest
    steps:
      - name: Reset admin password via backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo  | base64 -d > /tmp/reset_admin.py
            docker cp /tmp/reset_admin.py modishlog-backend:/tmp/reset_admin.py
            docker exec modishlog-backend python3 /tmp/reset_admin.py
            rm /tmp/reset_admin.py

      - name: Verify login works
        run: |
          curl -s -w "\nHTTP %{http_code}\n" \
            -X POST "${{ env.API_URL }}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@modishlog.com","password":"ModishAdmin@2024!"}'
