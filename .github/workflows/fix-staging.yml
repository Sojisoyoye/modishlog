name: Fix Staging (Admin + Business Link)

on:
  workflow_dispatch:

env:
  HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
  API_URL: https://api-modishlog.modishstandard.com

jobs:
  fix:
    name: Seed admin user, create business, stamp all data
    runs-on: ubuntu-latest
    steps:
      - name: Run fix script inside backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            echo  | base64 -d > /tmp/fix_staging_admin.py
            docker cp /tmp/fix_staging_admin.py modishlog-backend:/tmp/fix_staging_admin.py
            docker exec modishlog-backend python3 /tmp/fix_staging_admin.py
            rm /tmp/fix_staging_admin.py

      - name: Inject correct CORS and restart backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            cd /root/modishlog
            cat > docker-compose.override.yml << 'EOF'
            version: '3.8'
            services:
              backend:
                environment:
                  CORS_ORIGINS: '["https://modishlog-staging.vercel.app","https://modishlog-git-main-sojisoyoye.vercel.app","http://localhost:4200"]'
            EOF
            docker-compose up -d --no-deps backend
            echo "Waiting for backend to come up..."
            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
              if [ "$STATUS" = "200" ]; then echo "Backend healthy"; break; fi
              echo "attempt $i/12 ($STATUS)"; sleep 5
            done

      - name: Verify login works
        run: |
          curl -s -w "\nHTTP %{http_code}\n" \
            -X POST "${{ env.API_URL }}/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@modishlog.com","password":"ModishAdmin@2024!"}'
