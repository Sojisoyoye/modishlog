name: frontend-build
on:
  pull_request:
    paths: ['frontend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm,
                cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx ng build --configuration production
        working-directory: frontend

  # 4-way sharded E2E run. workers:1 stays pinned in playwright.config.ts (test
  # files share one Postgres DB/business and would race within a single run),
  # but each shard gets its own fully isolated CI runner + its own
  # backend/db_test/redis stack, so shards never contend with each other.
  # ~4x wall-clock speedup over one 20-30min serial run (task #178).
  e2e-shard:
    name: e2e-shard
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm,
                cache-dependency-path: frontend/package-lock.json }

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Build with dev config so the Angular app points to http://localhost:8000/api/v1
      # (production config hardcodes api.modishlog.com which isn't reachable in CI).
      # `--configuration development` is required explicitly -- angular.json's
      # `build` target defaults to "production" (defaultConfiguration), so a
      # bare `ng build` silently builds against api.modishlog.com instead of
      # localhost. This was the actual root cause of every E2E test needing a
      # backend call failing: every request got CORS-blocked against
      # production (which doesn't allow the localhost:4200 origin) rather
      # than reaching the local CI backend at all.
      - name: Build frontend (dev config)
        run: npx ng build --configuration development
        working-directory: frontend

      # Explicitly scoped to backend + db_test + redis — an unscoped `up -d`
      # also starts docker-compose.yml's `frontend` service (host port
      # 4200:4200), which collides with the "Serve frontend" step below
      # binding the same host port outside Docker. redis must be listed
      # explicitly too: backend's REDIS_URL always points at redis:6379
      # (see docker-compose.yml), but scoping to just backend+db_test never
      # started it, so every rate-limited endpoint (e.g. /auth/login) failed
      # to connect to Redis — breaking every e2e helper that logs in via a
      # direct API call (getAPIToken(), loginViaAPI()).
      - name: Start backend + test DB (e2e stack)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build backend db_test redis
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32x
          POSTGRES_PASSWORD: modishlog_dev

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "❌ Backend did not become healthy after 150s"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend
          exit 1

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Serve the built Angular app on port 4200. http-server is bundled with
      # npx so no separate install step is needed. -P (self-proxy) is a SPA
      # fallback: http-server has no built-in "serve index.html for unknown
      # routes" flag, so without it, any direct navigation to a client-side
      # route (e.g. page.goto('/login')) 404s instead of loading the Angular
      # app — verified directly (curl http://localhost:4200/login -> 404
      # without this flag, 200 with it) as the root cause of nearly every
      # e2e test failing at its beforeEach hook's page.goto()/locator calls.
      - name: Serve frontend (port 4200)
        run: npx http-server dist/frontend/browser -p 4200 -P "http://localhost:4200?" --silent &
        working-directory: frontend

      - name: Wait for frontend (port 4200)
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:4200; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/12)"
            sleep 5
          done
          echo "❌ Frontend did not become ready after 60s"
          exit 1

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium --reporter=list,html --shard=${{ matrix.shard }}/4
        working-directory: frontend
        env:
          CI: 'true'

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

  # Fan-in: build AND every shard must pass. Branch protection should require
  # this job ("frontend-build / gate") rather than the individual shard jobs
  # (matches the dependency-scan+test fan-in pattern in backend-tests.yml).
  gate:
    name: gate
    needs: [build, e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" || \
                "${{ needs.e2e-shard.result }}" != "success" ]]; then
            echo "❌ build=${{ needs.build.result }} e2e-shard=${{ needs.e2e-shard.result }}"
            exit 1
          fi
