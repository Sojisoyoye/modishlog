name: frontend-build
on:
  pull_request:
    paths: ['frontend/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm,
                cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx ng build --configuration production
        working-directory: frontend

  gate:
    name: gate
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm,
                cache-dependency-path: frontend/package-lock.json }

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Build with dev config so the Angular app points to http://localhost:8000/api/v1
      # (production config hardcodes api.modishlog.com which isn't reachable in CI).
      - name: Build frontend (dev config)
        run: npx ng build
        working-directory: frontend

      - name: Start backend + test DB (e2e stack)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32x
          POSTGRES_PASSWORD: modishlog_dev

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "❌ Backend did not become healthy after 150s"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend
          exit 1

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Serve the built Angular app on port 4200. http-server is bundled with
      # npx so no separate install step is needed.
      - name: Serve frontend (port 4200)
        run: npx http-server dist/frontend/browser -p 4200 --silent &
        working-directory: frontend

      - name: Wait for frontend (port 4200)
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:4200; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/12)"
            sleep 5
          done
          echo "❌ Frontend did not become ready after 60s"
          exit 1

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium --reporter=list,html
        working-directory: frontend
        env:
          CI: 'true'

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
