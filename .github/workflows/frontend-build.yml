name: frontend-build
on:
  pull_request:
    paths: ['frontend/**', '.github/workflows/frontend-build.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm,
                cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend

      # Task #221: matches the backend's pip-audit gate (_dependency-scan.yml).
      # Scoped to production dependencies (--omit=dev) -- devDependencies
      # (build tooling, test frameworks) never ship to a user's browser, so
      # their CVEs carry essentially none of the risk a runtime dependency's
      # does; auditing all ~600 dev deps would produce a much noisier,
      # lower-value gate. ACCEPTED_ADVISORIES is a deliberate, documented
      # exception list, not a blanket bypass -- currently just xlsx@0.18.5's
      # two advisories (no npm-registry fix exists; see the usage-site
      # comment in sales-page.component.ts for why the actual risk is
      # limited). Any newly introduced vulnerability not on this list fails
      # the build.
      - name: npm audit (production dependencies)
        working-directory: frontend
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          python3 << 'EOF'
          import json

          ACCEPTED_ADVISORIES = {
              "GHSA-4r6h-8v6p-xvw6",  # xlsx prototype pollution -- write-only usage, no fix on npm
              "GHSA-5pgg-2g8v-p4x9",  # xlsx ReDoS -- same package, no fix on npm
          }

          with open("/tmp/npm-audit.json") as f:
              data = json.load(f)

          unaccepted = []
          for name, v in data.get("vulnerabilities", {}).items():
              for via in v.get("via", []):
                  if not isinstance(via, dict):
                      continue
                  ghsa = via.get("url", "").rsplit("/", 1)[-1]
                  if ghsa not in ACCEPTED_ADVISORIES:
                      unaccepted.append(f"{name}: {via.get('title')} ({ghsa}) — {via.get('severity')}")

          if unaccepted:
              print("❌ New/unaccepted production dependency vulnerabilities found:")
              for line in unaccepted:
                  print(f"  - {line}")
              print()
              print("Fix them, or if genuinely unfixable/inapplicable, add the GHSA ID")
              print("to ACCEPTED_ADVISORIES in this workflow with a documented reason.")
              raise SystemExit(1)

          print("✅ No new production dependency vulnerabilities (only the documented xlsx@0.18.5 exceptions present, task #221)")
          EOF

      - run: npx ng build --configuration production
        working-directory: frontend

  # 8-way sharded E2E run (raised from 4 -- workers:1 within each shard means
  # wall-clock time is bounded by the slowest shard's total test time, not
  # setup overhead, so doubling shard count is the direct lever to roughly
  # halve it). workers:1 stays pinned in playwright.config.ts (test files
  # share one Postgres DB/business and would race within a single run), but
  # each shard gets its own fully isolated CI runner + its own
  # backend/db_test/redis stack, so shards never contend with each other.
  e2e-shard:
    name: e2e-shard
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm,
                cache-dependency-path: frontend/package-lock.json }

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Build with dev config so the Angular app points to http://localhost:8000/api/v1
      # (production config hardcodes api.modishlog.com which isn't reachable in CI).
      # `--configuration development` is required explicitly -- angular.json's
      # `build` target defaults to "production" (defaultConfiguration), so a
      # bare `ng build` silently builds against api.modishlog.com instead of
      # localhost. This was the actual root cause of every E2E test needing a
      # backend call failing: every request got CORS-blocked against
      # production (which doesn't allow the localhost:4200 origin) rather
      # than reaching the local CI backend at all.
      - name: Build frontend (dev config)
        run: npx ng build --configuration development
        working-directory: frontend

      # Explicitly scoped to backend + db_test + redis — an unscoped `up -d`
      # also starts docker-compose.yml's `frontend` service (host port
      # 4200:4200), which collides with the "Serve frontend" step below
      # binding the same host port outside Docker. redis must be listed
      # explicitly too: backend's REDIS_URL always points at redis:6379
      # (see docker-compose.yml), but scoping to just backend+db_test never
      # started it, so every rate-limited endpoint (e.g. /auth/login) failed
      # to connect to Redis — breaking every e2e helper that logs in via a
      # direct API call (getAPIToken(), loginViaAPI()).
      - name: Start backend + test DB (e2e stack)
        # Retries transient Docker Hub pull failures (e.g. "connection reset
        # by peer" fetching postgres:16-alpine) -- observed intermittently
        # failing whole shards before any test ran, unrelated to app code.
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build backend db_test redis; then
              exit 0
            fi
            echo "docker compose up failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done
          echo "❌ docker compose up failed after 3 attempts"
          exit 1
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32x
          POSTGRES_PASSWORD: modishlog_dev

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "❌ Backend did not become healthy after 150s"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend
          exit 1

      # Playwright's own install command already skips re-downloading a
      # browser binary that's present at the target revision -- caching
      # ~/.cache/ms-playwright across runs (keyed on the lockfile, so any
      # Playwright version bump invalidates it) turns 8x redundant Chromium
      # downloads per CI run into 8x cache restores. The OS-level apt
      # packages --with-deps also installs still run every time regardless
      # (each matrix job is a fresh, non-persisted VM), just not the
      # multi-hundred-MB browser download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Serve the built Angular app on port 4200. http-server is bundled with
      # npx so no separate install step is needed. -P (self-proxy) is a SPA
      # fallback: http-server has no built-in "serve index.html for unknown
      # routes" flag, so without it, any direct navigation to a client-side
      # route (e.g. page.goto('/login')) 404s instead of loading the Angular
      # app — verified directly (curl http://localhost:4200/login -> 404
      # without this flag, 200 with it) as the root cause of nearly every
      # e2e test failing at its beforeEach hook's page.goto()/locator calls.
      - name: Serve frontend (port 4200)
        run: npx http-server dist/frontend/browser -p 4200 -P "http://localhost:4200?" --silent &
        working-directory: frontend

      - name: Wait for frontend (port 4200)
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:4200; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/12)"
            sleep 5
          done
          echo "❌ Frontend did not become ready after 60s"
          exit 1

      - name: Run Playwright E2E tests
        run: npx playwright test --project=chromium --reporter=list,html --shard=${{ matrix.shard }}/8
        working-directory: frontend
        env:
          CI: 'true'

      # Backend runs in Docker; its stdout only ever reaches this job's log
      # via the "Wait for backend /health" step's failure branch, so any
      # info-level structlog output emitted *during* the test run (e.g.
      # per-request timing) was previously invisible here no matter what a
      # shard failed on -- dump it unconditionally so a slow/hung endpoint
      # can actually be diagnosed from CI output instead of guessing.
      - name: Show backend logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report/
          retention-days: 7

  # task #231: WebKit (Safari rendering engine) + a real mobile device
  # (iPhone 13, also WebKit-backed -- see playwright.config.ts) had zero
  # automated coverage before this; the whole E2E suite only ever ran
  # against desktop Chrome. Scoped to @smoke-tagged tests only via each
  # project's `grep` in playwright.config.ts -- not the full suite, to keep
  # CI time/cost bounded so close to launch. Expand post-launch.
  e2e-smoke-cross-browser:
    name: e2e-smoke-cross-browser
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm,
                cache-dependency-path: frontend/package-lock.json }

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend (dev config)
        run: npx ng build --configuration development
        working-directory: frontend

      - name: Start backend + test DB (e2e stack)
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build backend db_test redis; then
              exit 0
            fi
            echo "docker compose up failed (attempt $attempt/3), retrying in 10s..."
            sleep 10
          done
          echo "❌ docker compose up failed after 3 attempts"
          exit 1
        env:
          SECRET_KEY: ci-test-secret-key-do-not-use-in-production-32x
          POSTGRES_PASSWORD: modishlog_dev

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then
              echo "Backend is ready"
              exit 0
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 5
          done
          echo "❌ Backend did not become healthy after 150s"
          docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend
          exit 1

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright + WebKit
        run: npx playwright install --with-deps webkit
        working-directory: frontend

      - name: Serve frontend (port 4200)
        run: npx http-server dist/frontend/browser -p 4200 -P "http://localhost:4200?" --silent &
        working-directory: frontend

      - name: Wait for frontend (port 4200)
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:4200; then
              echo "Frontend is ready"
              exit 0
            fi
            echo "Waiting for frontend... ($i/12)"
            sleep 5
          done
          echo "❌ Frontend did not become ready after 60s"
          exit 1

      - name: Run smoke tests on WebKit + mobile
        run: npx playwright test --project=webkit --project=mobile --reporter=list,html
        working-directory: frontend
        env:
          CI: 'true'

      - name: Show backend logs
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend

      - name: Upload Playwright HTML report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke-cross-browser
          path: frontend/playwright-report/
          retention-days: 7

  # Fan-in: build AND every shard must pass. Branch protection should require
  # this job ("frontend-build / gate") rather than the individual shard jobs
  # (matches the dependency-scan+test fan-in pattern in backend-tests.yml).
  gate:
    name: gate
    needs: [build, e2e-shard, e2e-smoke-cross-browser]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" || \
                "${{ needs.e2e-shard.result }}" != "success" || \
                "${{ needs.e2e-smoke-cross-browser.result }}" != "success" ]]; then
            echo "❌ build=${{ needs.build.result }} e2e-shard=${{ needs.e2e-shard.result }} e2e-smoke-cross-browser=${{ needs.e2e-smoke-cross-browser.result }}"
            exit 1
          fi
