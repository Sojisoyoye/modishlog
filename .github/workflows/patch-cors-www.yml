name: Patch CORS www

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            CADDYFILE=/opt/modish/Caddyfile

            # Get the host IP that Caddy uses to reach the backend on port 8003
            DOCKER_GW=$(docker network inspect bridge \
              --format '{{range .IPAM.Config}}{{.Gateway}}{{"\n"}}{{end}}' \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
            BACKEND="${DOCKER_GW}:8003"
            echo "Backend: $BACKEND"

            # Replace the api.modishlog.com block using brace counting
            python3 - "$BACKEND" <<PYEOF
            import pathlib, sys
            backend = sys.argv[1]
            path = pathlib.Path("$CADDYFILE")
            lines = path.read_text().splitlines(keepends=True)
            out = []
            i = 0
            while i < len(lines):
                if lines[i].strip().startswith("api.modishlog.com") and "{" in lines[i]:
                    # Skip lines until we find the matching closing brace
                    depth = lines[i].count("{") - lines[i].count("}")
                    i += 1
                    while i < len(lines) and depth > 0:
                        depth += lines[i].count("{") - lines[i].count("}")
                        i += 1
                    # Write the replacement block
                    out.append(f"\napi.modishlog.com {{\n    reverse_proxy {backend}\n}}\n")
                else:
                    out.append(lines[i])
                    i += 1
            path.write_text("".join(out))
            print("Caddyfile updated")
            PYEOF

            echo "=== Updated api.modishlog.com block ==="
            grep -A 5 "api.modishlog.com" $CADDYFILE

            docker exec caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "Caddy reloaded"
