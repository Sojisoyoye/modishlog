name: Patch CORS www

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e
            # Back up before overwriting
            cp /opt/modish/Caddyfile /opt/modish/Caddyfile.bak
            # Write the correct Caddyfile from scratch
            echo "" | base64 -d > /opt/modish/Caddyfile
            echo "=== New api.modishlog.com block ==="
            grep -A 3 "api.modishlog.com {" /opt/modish/Caddyfile | tail -4
            docker exec caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "Caddy reloaded successfully"
