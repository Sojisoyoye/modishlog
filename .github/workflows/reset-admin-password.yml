name: Reset Admin Password

on:
  workflow_dispatch:

env:
  HETZNER_HOST: 178.104.122.53

jobs:
  reset:
    name: Reset admin user password
    runs-on: ubuntu-latest
    steps:
      - name: Reset password via backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            docker exec modishlog-backend python3 - <<'PYEOF'
            import asyncio, os
            from passlib.context import CryptContext
            from sqlalchemy.ext.asyncio import create_async_engine
            from sqlalchemy import text

            NEW_PASSWORD = "ModishAdmin@2024!"
            EMAIL = "admin@modishlog.com"

            pwd_ctx = CryptContext(schemes=["bcrypt"], deprecated="auto")
            hashed = pwd_ctx.hash(NEW_PASSWORD)

            async def main():
                engine = create_async_engine(os.environ["DATABASE_URL"])
                async with engine.begin() as conn:
                    result = await conn.execute(
                        text("UPDATE users SET hashed_password = :h, failed_login_attempts = 0, locked_until = NULL WHERE email = :e"),
                        {"h": hashed, "e": EMAIL},
                    )
                    print(f"Rows updated: {result.rowcount}")
                    if result.rowcount == 0:
                        # User doesn't exist — insert them
                        await conn.execute(
                            text("INSERT INTO users (id, email, hashed_password, full_name, is_active) VALUES (gen_random_uuid(), :e, :h, 'Admin User', true)"),
                            {"e": EMAIL, "h": hashed},
                        )
                        print("User created")
                await engine.dispose()

            asyncio.run(main())
            print(f"Done — {EMAIL} password set to: {NEW_PASSWORD}")
            PYEOF
