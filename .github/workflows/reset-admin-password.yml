name: Reset Admin Password

on:
  workflow_dispatch:

env:
  HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

jobs:
  reset:
    name: Reset admin user password
    runs-on: ubuntu-latest
    steps:
      - name: Reset password via backend container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: ADMIN_PASSWORD
          script: |
            # Write the script to disk on the host, copy into container, run it
            cat > /tmp/reset_admin.py << PYEOF
import asyncio, os
from passlib.context import CryptContext
from sqlalchemy.ext.asyncio import create_async_engine
from sqlalchemy import text

NEW_PASSWORD = os.environ["ADMIN_PASSWORD"]
EMAIL = "admin@modishlog.com"

pwd_ctx = CryptContext(schemes=["bcrypt"], deprecated="auto")
hashed = pwd_ctx.hash(NEW_PASSWORD)
print(f"Hash generated for {EMAIL}")

async def main():
    engine = create_async_engine(os.environ["DATABASE_URL"])
    async with engine.begin() as conn:
        result = await conn.execute(
            text("UPDATE users SET hashed_password = :h, failed_login_attempts = 0, locked_until = NULL WHERE email = :e"),
            {"h": hashed, "e": EMAIL},
        )
        print(f"Rows updated: {result.rowcount}")
        if result.rowcount == 0:
            await conn.execute(
                text("INSERT INTO users (id, email, hashed_password, full_name, is_active) VALUES (gen_random_uuid(), :e, :h, 'Admin User', true)"),
                {"e": EMAIL, "h": hashed},
            )
            print("User inserted")
    await engine.dispose()

asyncio.run(main())
print("Done — admin password reset successfully.")
PYEOF

            docker cp /tmp/reset_admin.py modishlog-backend:/tmp/reset_admin.py
            docker exec modishlog-backend python3 /tmp/reset_admin.py
            rm /tmp/reset_admin.py
