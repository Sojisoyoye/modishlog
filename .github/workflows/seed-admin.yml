name: Seed Admin User

on:
  workflow_dispatch:

env:
  BACKEND_URL: https://api-modishlog.modishstandard.com

jobs:
  seed:
    name: Create admin user
    runs-on: ubuntu-latest
    steps:
      - name: Check backend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${{ env.BACKEND_URL }}/health")
          echo "Health: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Backend is not healthy"
            exit 1
          fi

      - name: Register admin user
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" --max-time 30 \
            -X POST "${{ env.BACKEND_URL }}/api/v1/auth/register" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@modishlog.com","password":"Admin@1234","full_name":"Admin User"}')
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS/d')
          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d: -f2)
          echo "HTTP Status: $STATUS"
          echo "Response: $BODY"
          if [ "$STATUS" = "201" ]; then
            echo "Admin user created"
            echo "Email   : admin@modishlog.com"
            echo "Password: Admin@1234"
          elif [ "$STATUS" = "409" ]; then
            echo "User already exists"
            echo "Email   : admin@modishlog.com"
            echo "Password: Admin@1234"
          else
            echo "Unexpected status: $STATUS"
            exit 1
          fi
