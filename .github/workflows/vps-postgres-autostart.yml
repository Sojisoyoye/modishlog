name: VPS — Enable PostgreSQL Auto-Start

on:
  workflow_dispatch:

jobs:
  configure:
    name: Enable PostgreSQL auto-start on VPS reboot
    runs-on: ubuntu-latest
    steps:
      - name: Enable PostgreSQL and check Docker/Compose systemd units
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: root
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -e

            echo "=== Step 1: Enable PostgreSQL auto-start ==="
            systemctl enable postgresql
            systemctl is-enabled postgresql

            echo "=== Step 2: Check current PostgreSQL status ==="
            systemctl status postgresql --no-pager -l || true

            echo "=== Step 3: Verify PostgreSQL is active ==="
            systemctl is-active postgresql

            echo "=== Step 4: Check for Docker Compose systemd units ==="
            systemctl list-units --type=service --no-pager | grep -i "compose\|heimpath" || echo "No compose/heimpath systemd units found"
            systemctl list-unit-files --no-pager | grep -i "compose\|heimpath" || echo "No compose/heimpath unit files found"

            echo "=== Step 5: Check Docker daemon auto-start ==="
            systemctl is-enabled docker || systemctl enable docker

            echo "=== Step 6: Final verification ==="
            echo "postgresql enabled: $(systemctl is-enabled postgresql)"
            echo "postgresql active:  $(systemctl is-active postgresql)"
            echo "docker enabled:     $(systemctl is-enabled docker)"
            echo "docker active:      $(systemctl is-active docker)"

            echo "=== Step 7: Running Docker containers ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}' | head -20

            echo "=== DONE ==="
