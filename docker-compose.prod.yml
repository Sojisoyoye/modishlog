# Production deployment — shared Hetzner box (178.104.122.53), see DEPLOYMENT.md.
#
# CI/CD: .github/workflows/deploy-production.yml scp's this file to
# /root/modishlog-prod/docker-compose.yml and deploys with
# `docker compose -f docker-compose.yml --env-file .env.production`. Before
# 2026-09-10 (task 254) this never actually happened -- the deploy script had
# no -f flag and no scp step, so it silently used whatever docker-compose.yml
# already existed on the server (which this repo's copy had drifted from:
# wrong container names, missing the shared modish_modish Caddy network,
# wrong volume names, and postgres:16-alpine here vs the real 15-alpine
# already running against a pg15-formatted data volume). Fixed to match the
# real server exactly -- see git history on this file for what "real" meant
# before this fix if any of the above needs re-verifying.
#
# container_name, networks, and the volume names below are load-bearing:
# - modishlog_db / modishlog-prod-backend: the shared Caddy reverse proxy on
#   this box (owned by modish-infra) reaches the backend by container name on
#   the modish_modish network, not by host port.
# - modishlog_postgres_data / modishlog_uploads: these must exactly match the
#   existing Docker volume names (Docker Compose auto-prefixes them with the
#   project name derived from the deploy directory, modishlog-prod) or the
#   backend will mount a brand-new EMPTY volume instead of the real database/
#   uploads on next deploy.
#
# Prerequisites:
#   - .env.production file present on the server (see .env.production.example)

services:
  # ─── Redis (shared rate-limit state across gunicorn workers) ─────────────
  redis:
    image: redis:7-alpine
    container_name: modishlog-prod-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - modishlog_prod

  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: modishlog_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modishlog}
      POSTGRES_USER: ${POSTGRES_USER:-modishlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - modishlog_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modishlog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - modishlog_prod

  # ─── Backend (gunicorn + uvicorn workers) ────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/sojisoyoye/modishlog/backend:production}
    container_name: modishlog-prod-backend
    restart: unless-stopped
    ports:
      - "8003:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-modishlog}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB:-modishlog}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://modishlog.com","https://www.modishlog.com"]}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      UPLOAD_DIR: /app/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      FX_API_KEY: ${FX_API_KEY:-}
      FX_LIVE_API_URL: ${FX_LIVE_API_URL:-https://open.er-api.com/v6/latest/USD}
      FX_CACHE_TTL_HOURS: ${FX_CACHE_TTL_HOURS:-4}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-contact@modishlog.com}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-ModishLog}
      FRONTEND_URL: ${FRONTEND_URL:-https://modishlog.com}
    # --workers is load-bearing for DB connection headroom (task #228):
    # each worker opens up to DB_POOL_SIZE + DB_MAX_OVERFLOW connections
    # (core/config.py), so total demand is workers * (pool_size +
    # max_overflow). The `db` service below is a plain postgres:15-alpine
    # with the default max_connections=100. If you raise --workers here,
    # lower DB_POOL_SIZE/DB_MAX_OVERFLOW via env vars to compensate, or
    # raise Postgres's own max_connections first (confirm available RAM on
    # the Hetzner box before doing that -- it's shared with staging's
    # containers on the same VPS, even though staging's DB itself is a
    # separate Neon instance). See core/config.py's DB_POOL_SIZE comment
    # and .taskmaster/docs/loadtest-findings-243.md for the load test that
    # reproduced this as a real failure, not just a theoretical risk.
    command: >
      gunicorn src.main:app
        --worker-class uvicorn.workers.UvicornWorker
        --workers 2
        --bind 0.0.0.0:8000
        --timeout 60
        --keep-alive 5
        --access-logfile -
        --error-logfile -
    volumes:
      - modishlog_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - modishlog_prod
      - modish_modish

volumes:
  modishlog_postgres_data:
  modishlog_uploads:

networks:
  modishlog_prod:
    name: modishlog_prod
  modish_modish:
    external: true
