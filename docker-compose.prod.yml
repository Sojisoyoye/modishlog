# Production deployment — Hetzner VPS, modishlog.com
# On the VPS, run:  docker compose --env-file .env.production -f docker-compose.prod.yml up -d
# Or use scripts/deploy-prod.sh which handles env loading automatically.
#
# Prerequisites:
#   - .env.production file present (see .env.production.example)
#   - Let's Encrypt cert already issued (first run: bash scripts/init-letsencrypt.sh)
#
# Initial SSL:    bash scripts/init-letsencrypt.sh
# Deploy update:  bash scripts/deploy-prod.sh [image_tag]

services:
  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-modishlog}
      POSTGRES_USER: ${POSTGRES_USER:-modishlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c log_min_duration_statement=1000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-modishlog}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    cpus: 0.5

  # ─── Backend (gunicorn + uvicorn workers) ────────────────────────────────
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/sojisoyoye/modishlog/backend:production}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-modishlog}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB:-modishlog}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://modishlog.com"]}
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      UPLOAD_DIR: /app/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      FX_API_KEY: ${FX_API_KEY:-}
      FX_LIVE_API_URL: ${FX_LIVE_API_URL:-https://open.er-api.com/v6/latest/USD}
      FX_CACHE_TTL_HOURS: ${FX_CACHE_TTL_HOURS:-4}
      SENTRY_DSN: ${SENTRY_DSN:-}
    command: >
      gunicorn src.main:app
        --worker-class uvicorn.workers.UvicornWorker
        --workers 2
        --bind 0.0.0.0:8000
        --timeout 60
        --keep-alive 5
        --access-logfile -
        --error-logfile -
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0

  # ─── Nginx (SSL termination + static files) ───────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - uploads_data:/app/uploads:ro
    depends_on:
      - backend
    mem_limit: 128m
    cpus: 0.25

  # ─── Certbot (Let's Encrypt auto-renewal) ────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --quiet --webroot --webroot-path=/var/www/certbot; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  uploads_data:
  certbot_www:
  certbot_certs:
