# Staging deployment — Azure Container Apps
# Database: Neon PostgreSQL (external, configured via DATABASE_URL secret)
# Frontend: Vercel (separate deployment)
#
# Initial setup:  bash infra/azure/setup-staging.sh
# CI/CD updates:  .github/workflows/deploy-staging.yml

services:
  # ─── Redis (shared rate-limit state across gunicorn workers) ─────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/sojisoyoye/modishlog/backend:${IMAGE_TAG:-staging}
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${STAGING_DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SECRET_KEY: ${STAGING_SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      CORS_ORIGINS: ${STAGING_CORS_ORIGINS:-https://staging.modishlog.com}
      ENVIRONMENT: staging
      LOG_LEVEL: info
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FX_API_KEY: ${FX_API_KEY:-}
      FX_API_URL: ${FX_API_URL:-https://api.example.com/fx}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-noreply@modishlog.com}
      EMAILS_FROM_NAME: ${EMAILS_FROM_NAME:-ModishLog}
      FRONTEND_URL: ${FRONTEND_URL:-https://staging.modishlog.com}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
