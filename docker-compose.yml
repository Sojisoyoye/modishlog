services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: modishlog
      POSTGRES_USER: modishlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modishlog_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ['5434:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U modishlog']
      interval: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    environment:
      DATABASE_URL: postgresql+asyncpg://modishlog:${POSTGRES_PASSWORD:-modishlog_dev}@db/modishlog
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      CORS_ORIGINS: '["http://localhost:4200","http://localhost","https://modishlog-staging.vercel.app"]'
      ENVIRONMENT: development
      TZ: UTC
    ports: ['8000:8000']
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - ./backend:/app
      - uploads_data:/uploads
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    ports: ['4200:4200']
    depends_on: [backend]

volumes:
  postgres_data:
  uploads_data:
