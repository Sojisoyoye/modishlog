worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;
    server_tokens off;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name modishlog.com www.modishlog.com;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://modishlog.com$request_uri;
        }
    }

    # ── www → apex redirect ───────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name www.modishlog.com;

        ssl_certificate /etc/letsencrypt/live/modishlog.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/modishlog.com/privkey.pem;
        include /etc/nginx/snippets/ssl-params.conf;

        return 301 https://modishlog.com$request_uri;
    }

    # ── Main production server ────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name modishlog.com;

        ssl_certificate /etc/letsencrypt/live/modishlog.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/modishlog.com/privkey.pem;
        include /etc/nginx/snippets/ssl-params.conf;

        # ── Security headers (enforced at edge) ───────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

        # ── Uploaded static files ─────────────────────────────────────────────
        location /static/ {
            alias /app/uploads/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # ── API proxy → backend ───────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;

            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ── Auth endpoints — stricter rate limit ──────────────────────────────
        location ~ ^/api/v1/auth/(login|forgot-password|reset-password) {
            limit_req zone=auth burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health check (no rate limit, lightweight) ─────────────────────────
        location = /health {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            access_log off;
        }

        # ── Angular SPA — all other routes ────────────────────────────────────
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Hashed JS/CSS assets — immutable cache
        location ~* \.(js|css)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Images and fonts — long cache
        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
        }

        # index.html — never cache (SPA entry point)
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
